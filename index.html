<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Визитка</title>
    <meta name="description" content="Images - A-Frame" />
    <script src="js/aframe.1.6.0.min.js"></script>
    <script src="js/mindar-image-aframe.prod.js"></script>
    <script>
      const showInfo = () => {
        let y = 0;
        const profileButton = document.querySelector("#profile-button");
        const webButton = document.querySelector("#web-button");
        const emailButton = document.querySelector("#email-button");
        const locationButton = document.querySelector("#location-button");
        const text = document.querySelector("#text");

        profileButton.setAttribute("visible", true);
        setTimeout(() => {
          webButton.setAttribute("visible", true);
        }, 300);
        setTimeout(() => {
          emailButton.setAttribute("visible", true);
        }, 600);
        setTimeout(() => {
          locationButton.setAttribute("visible", true);
        }, 900);

        let currentTab = "";
        webButton.addEventListener("click", function (evt) {
          text.setAttribute("value", "tekct");
          currentTab = "web";
        });
        emailButton.addEventListener("click", function (evt) {
          text.setAttribute("value", "hello@softmind.tech");
          currentTab = "email";
        });
        profileButton.addEventListener("click", function (evt) {
          text.setAttribute("value", "AR, VR solutions и consultation");
          currentTab = "profile";
        });
        locationButton.addEventListener("click", function (evt) {
          console.log("loc");
          text.setAttribute("value", "Vancouver, Canada | Hong Kong");
          currentTab = "location";
        });

        text.addEventListener("click", function (evt) {
          if (currentTab === "web") {
            window.location.href = "https://www.tvsz.ru/";
          }
        });
      };

      const showPortfolio = (done) => {
        const portfolio = document.querySelector("#portfolio-panel");
        const portfolioLeftButton = document.querySelector(
          "#portfolio-left-button",
        );
        const portfolioRightButton = document.querySelector(
          "#portfolio-right-button",
        );
        const paintandquestPreviewButton = document.querySelector(
          "#paintandquest-preview-button",
        );

        let y = 0;
        let currentItem = 0;

        portfolio.setAttribute("visible", true);

        const showPortfolioItem = (item) => {
          for (let i = 0; i <= 2; i++) {
            document
              .querySelector("#portfolio-item" + i)
              .setAttribute("visible", i === item);
          }
        };
        const id = setInterval(() => {
          y += 0.008;
          if (y >= 0.6) {
            clearInterval(id);
            portfolioLeftButton.setAttribute("visible", true);
            portfolioRightButton.setAttribute("visible", true);
            portfolioLeftButton.addEventListener("click", () => {
              currentItem = (currentItem + 1) % 3;
              showPortfolioItem(currentItem);
            });
            portfolioRightButton.addEventListener("click", () => {
              currentItem = (currentItem - 1 + 3) % 3;
              showPortfolioItem(currentItem);
            });

            paintandquestPreviewButton.addEventListener("click", () => {
              paintandquestPreviewButton.setAttribute("visible", false);
              const testVideo = document.createElement("video");
              const canplayWebm = testVideo.canPlayType(
                'video/webm; codecs="vp8, vorbis"',
              );
              if (canplayWebm == "") {
                document
                  .querySelector("#paintandquest-video-link")
                  .setAttribute("src", "#paintandquest-video-mp4");
                document.querySelector("#paintandquest-video-mp4").play();
              } else {
                document
                  .querySelector("#paintandquest-video-link")
                  .setAttribute("src", "#paintandquest-video-webm");
                document.querySelector("#paintandquest-video-webm").play();
              }
            });

            setTimeout(() => {
              done();
            }, 500);
          }
          portfolio.setAttribute("position", "0 " + y + " -0.01");
        }, 10);
      };

      const showAvatar = (onDone) => {
        const avatar = document.querySelector("#avatar");
        let z = -0.3;
        const id = setInterval(() => {
          z += 0.008;
          if (z >= 0.3) {
            clearInterval(id);
            onDone();
          }
          avatar.setAttribute("position", "0 -0.25 " + z);
        }, 10);
      };

      AFRAME.registerComponent("mytarget", {
        init: function () {
          this.el.addEventListener("targetFound", (event) => {
            console.log("target found");
            showAvatar(() => {
              setTimeout(() => {
                showPortfolio(() => {
                  setTimeout(() => {
                    showInfo();
                  }, 300);
                });
              }, 300);
            });
          });
          this.el.addEventListener("targetLost", (event) => {
            console.log("target found");
          });
          //this.el.emit('targetFound');
        },
      });
    </script>

    <style>
      body {
        margin: 0;
      }
      .example-container {
        overflow: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
      }

      #example-scanning-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: transparent;
        z-index: 2;
      }
      @media (min-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
          width: 50vh;
          height: 50vh;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #example-scanning-overlay .inner {
          width: 50vw;
          height: 30vw;
        }
      }

      #example-scanning-overlay .inner {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;

        background:
          linear-gradient(to right, white 10px, transparent 10px) 0 0,
          linear-gradient(to right, white 10px, transparent 10px) 0 100%,
          linear-gradient(to left, white 10px, transparent 10px) 100% 0,
          linear-gradient(to left, white 10px, transparent 10px) 100% 100%,
          linear-gradient(to bottom, white 10px, transparent 10px) 0 0,
          linear-gradient(to bottom, white 10px, transparent 10px) 100% 0,
          linear-gradient(to top, white 10px, transparent 10px) 0 100%,
          linear-gradient(to top, white 10px, transparent 10px) 100% 100%;
        background-repeat: no-repeat;
        background-size: 40px 40px;
      }

      #example-scanning-overlay.hidden {
        display: none;
      }

      #example-scanning-overlay img {
        opacity: 0.3;
        width: 90%;
        align-self: center;
      }

      #example-scanning-overlay .inner .scanline {
        position: absolute;
        width: 100%;
        height: 10px;
        background: white;
        animation: move 2s linear infinite;
      }
      @keyframes move {
        0%,
        100% {
          top: 0%;
        }
        50% {
          top: calc(100% - 10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="example-container">
      <div id="example-scanning-overlay" class="hidden">
        <div class="inner">
          <img src="img/Подпись.jpg" />

          <div class="scanline"></div>
        </div>
      </div>
    <a-scene mindar-image="imageTargetSrc: marker/targets.mind; showStats: false; uiScanning: #example-scanning-overlay; " 
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
      
      <a-camera 
          position="0 0 0"
          look-controls="enabled: false"
          cursor="fuse: false; rayOrigin: mouse;"
          raycaster="far: 10000; objects: .clickable"
        >
        </a-camera>
      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0" >
        <a-entity scale="0.5 0.5 0.5">
        
          <a-video 
            width="1.3"
            height="2.3"
            position="1.7 -0.65 0"
            src="video/arvideo.mp4"
          >
          </a-video>
          <a-video
            width="2"
            height="1"
            position="0 1.04 0"
            src="video/Слайды.mp4"
          >
          </a-video>
     
        <!--<a-plane
          position="0 0 0"
          rotation="0 0 0"
          width="2"
          height="1"
          src="Img/Подпись.jpg"
        ></a-plane>-->
        <a-image
          opacity="1"
          position="1.7 1.1 0"
          rotation="0 0 0"
          src="img/аватар_2.png"
          width="1.15"
          height="1"
          
        ></a-image>
        <a-image
          opacity="1"
          position="-0.3 -0.8 0"
          rotation="0 0 0"
          src="иконки/инста.png"
          width="0.5"
          height="0.5"
          
        ></a-image
        ><a-image
          opacity="1"
          position="0.3 -0.8 0"
          rotation="0 0 0"
          src="иконки/ВК.png"
          width="0.46"
          height="0.46"
          
        ></a-image>
       </a-entity>
    </a-scene>
  </body>
</html>
