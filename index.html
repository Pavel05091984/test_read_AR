<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlvaAR + Three.js Пример</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-family: Arial, sans-serif;
      z-index: 100;
    }
    #video { display: none; } /* Скрываем видео, используем только для обработки */
  </style>
</head>
<body>
  <div id="info">Загрузка AR-системы...</div>
  <video id="video" autoplay muted playsinline></video>

  <!-- Подключаем библиотеки -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.alvaar.com/sdk/v1/alvaar.js"></script>

  <script>
    const video = document.getElementById('video');
    const info = document.getElementById('info');

    let alva = null;
    let scene, camera, renderer, cube;

    async function init() {
      try {
        // 1. Доступ к камере
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720 }
        });
        video.srcObject = stream;

        // Ждём загрузки видео
        video.onloadedmetadata = async () => {
          // 2. Инициализация AlvaAR
          alva = await AlvaAR.Initialize(video.videoWidth, video.videoHeight);
          info.textContent = 'Наведите камеру на ровную поверхность...';

          // 3. Настройка Three.js
          setupThreeJS();

          // 4. Запуск основного цикла
          requestAnimationFrame(animate);
        };
      } catch (error) {
        console.error('Ошибка:', error);
        info.textContent = 'Ошибка: ' + error.message;
      }
    }

    function setupThreeJS() {
      // Создаём сцену Three.js
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      // Рендерер
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 10, 5);
      scene.add(directionalLight);

      // Создаём куб
      const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
      cube = new THREE.Mesh(geometry, material);
      scene.add(cube);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Получаем данные с камеры
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
      const frame = ctx.getImageData(0, 0, video.videoWidth, video.videoHeight);

      // 1. Определяем позицию камеры
      const cameraPose = alva.findCameraPose(frame);
      if (cameraPose) {
        updateCameraPose(cameraPose);
      }

      // 2. Ищем плоскости
      const planePose = alva.findPlane();
      if (planePose) {
        info.textContent = 'Плоскость обнаружена! Объект размещён.';
        updateCubePosition(planePose);
      } else {
        info.textContent = 'Наведите камеру на ровную поверхность с текстурой...';
      }

      // Рендерим сцену
      renderer.render(scene, camera);
    }

    function updateCameraPose(pose) {
      // Преобразуем матрицу позы AlvaAR в позицию Three.js
      const matrix = new THREE.Matrix4();
      matrix.fromArray(pose.matrix);
      camera.matrix.copy(matrix);
      camera.matrixWorldNeedsUpdate = true;
    }

    function updateCubePosition(planePose) {
      // Размещаем куб на обнаруженной плоскости
      const matrix = new THREE.Matrix4();
      matrix.fromArray(planePose.matrix);

      // Слегка поднимаем куб над плоскостью
      const position = new THREE.Vector3();
      position.setFromMatrixPosition(matrix);
      position.y += 0.15; // Высота куба — 0.3, делим пополам

      cube.position.copy(position);

      // Ориентируем куб по плоскости
      const rotation = new THREE.Quaternion();
      rotation.setFromRotationMatrix(matrix);
      cube.quaternion.copy(rotation);
    }

    // Запускаем при загрузке страницы
    window.addEventListener('load', init);
  </script>
</body>
</html>
