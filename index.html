<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR без A-Frame</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-family: Arial, sans-serif;
      z-index: 100;
    }
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background: #4285f4;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      z-index: 101;
    }
  </style>
</head>
<body>
  <div id="info">Наведите камеру на ровную поверхность с текстурой</div>
  <button id="startButton">Запустить AR</button>

  <!-- Подключаем Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const info = document.getElementById('info');
    const startButton = document.getElementById('startButton');

    // Проверка поддержки WebXR
    if (!navigator.xr) {
      info.textContent = 'WebXR не поддерживается вашим браузером';
      startButton.disabled = true;
    } else {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (!supported) {
          info.textContent = 'AR не поддерживается вашим устройством';
          startButton.disabled = true;
        }
      });
    }

    startButton.addEventListener('click', initXR);

    async function initXR() {
      try {
        // Скрываем кнопку запуска
        startButton.style.display = 'none';

        // Запрос AR-сессии с поддержкой обнаружения плоскостей
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor', 'hit-test']
        });

        // Создаём canvas для рендеринга
        const canvas = document.createElement('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        document.body.appendChild(canvas);

        // Получаем WebGL контекст
        const gl = canvas.getContext('webgl2', { xrCompatible: true });

        // Инициализируем Three.js
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, context: gl });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera();

        // Добавляем освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        scene.add(directionalLight);

        // Создаём объект для размещения (куб)
        const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Переменная для хранения источника hit-test
        let hitTestSource = null;

        // Запрашиваем источник hit-test для обнаружения поверхностей
        session.requestHitTestSource({
          space: session.requestReferenceSpace('viewer')
        }).then((source) => {
          hitTestSource = source;
        });

        // Пространство координат
        const referenceSpace = await session.requestReferenceSpace('local-floor');

        // Основной цикл рендеринга WebXR
        function onXRFrame(time, frame) {
          const pose = frame.getViewerPose(referenceSpace);

          if (pose) {
            // Очистка экрана
            gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
            gl.viewport(0, 0, session.renderState.baseLayer.framebufferWidth, session.renderState.baseLayer.framebufferHeight);
            renderer.render(scene, camera);

            // Обработка hit-test результатов
            if (hitTestSource) {
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const hitPose = hit.getPose(referenceSpace);
                if (hitPose) {
                  // Преобразуем матрицу позы в позицию Three.js
                  const matrix = new THREE.Matrix4();
                  matrix.fromArray(hitPose.transform.matrix);
                  cube.position.setFromMatrixPosition(matrix);
                  info.textContent = 'Объект размещён на поверхности!';
                }
              } else {
                info.textContent = 'Наведите камеру на поверхность с текстурой';
              }
            }
          }

          // Запрашиваем следующий кадр
          session.requestAnimationFrame(onXRFrame);
        }

        // Начинаем анимацию
        session.requestAnimationFrame(onXRFrame);

      } catch (error) {
        console.error('Ошибка AR:', error);
        info.textContent = 'Не удалось запустить AR: ' + error.message;
      }
    }
  </script>
</body>
</html>
