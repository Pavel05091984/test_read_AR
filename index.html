<!doctype html>
<html>
  <head>
    <title>Управление движением</title>
    <meta name="description" content="A-Frame Examples" />
    <script src="js/aframe-master-v1.3.0.min.js"></script>
    <script src="js/aframe-environment-component.min.js"></script>
    <script src="js/extended-wasd-controls.js"></script>
    <script src="js/joystick.js"></script>
    <style>
      body {
        /* отключить длительное нажатие в iOS? */
        -webkit-touch-callout: none;
      }

      .mainUI {
        border: 0px solid pink;
        position: fixed;
        top: 0px;
        width: 99%;
        height: 99%;
        z-index: 1;
        pointer-events: none; /* разрешить переход по ссылке в прозрачных областях */
      }

      .regionUI {
        border: 0px solid yellow;
        position: absolute;
        display: flex;
        flex-direction: row;
        pointer-events: none;
      }

      .buttonUI {
        border: 0px solid lime;
        display: flex;
        flex-direction: column;
        justify-content: center;
        pointer-events: auto;
        filter: drop-shadow(0px 0px 20px white);
      }

      .skyColor {
        filter: hue-rotate(240deg) saturate(100%) brightness(100%)
          drop-shadow(0px 0px 20px white);
      }

      .baseColor {
        filter: hue-rotate(24deg) saturate(68%) brightness(100%)
          drop-shadow(0px 0px 20px white);
      }

      .grayColor {
        filter: hue-rotate(0deg) saturate(0%) brightness(100%)
          drop-shadow(0px 0px 20px white);
      }
    </style>
  </head>

  <body>
    <!-- примечание: используя красные базовые изображения для кнопок, можно подкрасить (HSV) с помощью фильтра: оттенок-поворот(); и т.д. -->

    <div class="mainUI" id="uiDiv" oncontextmenu="return false;">
      <!-- вверху слева -->
      <div
        class="regionUI skyColor"
        style="top: 10px; left: 10px"
        oncontextmenu="return false;"
      ></div>

      <!-- вверху справа -->
      <div class="regionUI" style="top: 10px; right: 10px"></div>

      <!-- внизу слева -->
      <div class="regionUI" style="bottom: 10px; left: 10px">
        <div class="buttonUI" style="width: 128px; opacity: 0.8">
          <img src="image/Кнопка/joystick-base.png" />
          <div id="stick1" style="position: absolute; left: 32px; top: 32px">
            <img src="image/Кнопка/joystick-red.png" />
          </div>
        </div>
      </div>

      <!-- внизу справа -->
      <div class="regionUI baseColor" style="bottom: 10px; right: 10px"></div>
    </div>

    <script>
      // необходимо запустить javascript-код после загрузки объектов и компонентов a-scene
      AFRAME.registerComponent("screen-controls", {
        init: function () {
          this.component =
            document.getElementById("camera").components[
              "extended-wasd-controls"
            ];
          this.joystick1 = new Joystick("stick1", 64, 8);
          console.log("controls initialized");
        },

        tick: function (time, deltaTime) {
          // console.log( joystick1.value )
          // console.log( this.component.movePercent )
          this.component.movePercent.x = this.joystick1.value.x;
          this.component.movePercent.z = -this.joystick1.value.y;
        },
      });
    </script>

    <!-- 
	отключить нажмите "F", чтобы перейти в полноэкранный режим
отключите элементы управления WASD, подключенные к камере по умолчанию.
 -->
    <a-scene
      keyboard-shortcuts="enterVR: false;"
      vr-mode-ui="enabled: false;"
      screen-controls
    >
      <a-assets>
        <!-- добавление элементов управления внешним видом; автоматически устанавливает значение turnEnabled/lookEnabled равным false  -->
        <a-asset-item
          id="MTLB"
          src="Тестовые/Новая папка/С наклейками-compressed_3.glb"
        ></a-asset-item>
      </a-assets>
      <a-entity
        light="type: directional; color: #ffffff; intensity: 8; castShadow: true"
        position="0 10 -4"
        rotation="-20 -45 0"
      ></a-entity>
      <a-plane
        position="0 0 -4"
        height="2"
        width="2"
        rotation="-90 0 0"
        color="red"
      ></a-plane>
      <a-entity position="-1 0 -5">
        <a-gltf-model
          rotation="0 0 0"
          position="0 0 0"
          scale="8 8 8"
          gltf-model="#MTLB"
        >
        </a-gltf-model>
      </a-entity>
      <a-entity
        id="camera"
        camera
        look-controls
        position="0 1.6 0"
        extended-wasd-controls="flyEnabled: true; inputType: joystick;"
      >
      </a-entity>
    </a-scene>
  </body>
</html>
